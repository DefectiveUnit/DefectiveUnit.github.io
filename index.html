<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>flythrough.homes</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --text: #1b1f23; --muted: #6b7178; --blue: #2b7cff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15181b; --text: #eef0f2; --muted: #9aa1a8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
    h1 span { color: var(--blue); }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>flythrough<span>.homes</span></h1>
      <p>3D fly-throughs of homes for rent. Follow the link you were given to see a property.</p>
    </div>
  </main>
</body>
</html>
